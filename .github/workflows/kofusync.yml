# Compila la imagen Docker de KofuSync y la publica en GitHub Container Registry:
#   ghcr.io/<usuario>/kofusync:latest   (amd64 y arm64)
name: KofuSync (imagen Docker)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['kofusync/**', '.github/workflows/kofusync.yml']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kofusync" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: kofusync
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
