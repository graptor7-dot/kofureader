# Publica una versión: al subir un tag vX.Y.Z compila Android, iPad y Windows
# y los sube a GitHub Releases. Las apps buscan ahí las actualizaciones.
#
#   git tag v1.1.0 && git push origin v1.1.0
name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Faltan los secretos de firma"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=kofureader
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk KofuReader-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: app/KofuReader-android.apk }

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr KofuReader-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: app/KofuReader-ios.ipa }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${GITHUB_REF_NAME#v} --build-number=${{ github.run_number }}
      - name: Empaquetar .zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath KofuReader-windows.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: app/KofuReader-windows.zip }

  publicar:
    needs: [android, ios, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: KofuReader ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
